name: Build 32-bit Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ARMv7a 32-bit APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake (32-bit ARMv7a toolchain)
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platform-tools" "platforms;android-30"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set NDK Environment Variables
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build 32-bit Debug APK (Only armeabi-v7a)
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.build.abi=armeabi-v7a \
            -DANDROID_ABI=armeabi-v7a \
            --stacktrace

      - name: Verify 32-bit APK Output
        run: |
          echo "Listing generated APKs:"
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-32bit-ai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
